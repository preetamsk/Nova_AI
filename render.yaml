services:
  - type: web
    name: nova-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Production Vercel URL:
      - key: FRONTEND_ORIGINS
        value: https://frontend-six-beta-80.vercel.app
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: MAX_UPLOAD_BYTES
        value: 8388608
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
